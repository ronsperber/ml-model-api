[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ml-model-api"
version = "0.1.0"
description = "A full-stack ML model serving system with FastAPI and Streamlit"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}

dependencies = [
    "fastapi>=0.110.0",
    "uvicorn>=0.29.0",
    "streamlit>=1.33.0",
    "scikit-learn>=1.4.0",
    "pandas>=2.0.0",
    "numpy>=1.26.0",
    "pydantic>=2.0.0",
    "joblib>=1.3.0",
    "python-dotenv>=1.0.0",
    "requests>=2.31.0",
    "matplotlib>=3.10.9",
    "category-encoders>=2.8.1",
    "lightgbm>=4.6.0",
    "xgboost>=3.2.0",
    "pyfredapi>=0.10.2",
    "plotly>=6.7.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "httpx>=0.27.0",
]

[tool.pytest.ini_options]
testpaths = ["unittests"]
pythonpath = ["."]

[tool.setuptools.packages.find]
where = ["."]
exclude = ["experiments*", "local*", "tests*"]

[dependency-groups]
dev = [
    "ipykernel>=7.2.0",
]
